name: Bash Syntax Check
on:
  push:
    branches: [ "feature/ai-agent", "feature/ai-agent-native" ]
  workflow_dispatch:
jobs:
  sh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cek semua skrip shell
        run: |
          fail=0
          for f in $(find . -name '*.sh' -not -path './.git/*'); do
            sh -n "$f" || { echo "syntax error: $f"; fail=1; }
          done
          exit $fail
