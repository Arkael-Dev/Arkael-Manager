plugins {
    id 'com.android.application'
}

def versionProps = new Properties()
rootProject.file("version.properties").withInputStream { versionProps.load(it) }

android {
    namespace 'com.arkael.app'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.arkael.app"
        minSdk 24
        targetSdk 34
        versionCode versionProps.getProperty("versionCode").toInteger()
        versionName versionProps.getProperty("versionName")

    }

    // --- SIGNING FIXES (Moved outside buildTypes) ---
    signingConfigs {
        release {
            storeFile file("release.jks")
            storePassword System.getenv("SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("SIGNING_KEY_ALIAS")
            keyPassword System.getenv("SIGNING_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Using the config defined above
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // --- GLIDE & GIF SUPPORT ---
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    
    // THIS IS THE KEY TO MAKING THE GIF MOVE
    implementation 'com.github.bumptech.glide:gifdecoder:4.16.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // --- YouTube player (ad-free): pulls raw stream URLs directly, the same technique NewPipe/LibreTube use ---
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
}
