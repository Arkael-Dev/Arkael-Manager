plugins {
    id 'com.android.application'
}

def versionProps = new Properties()
rootProject.file("version.properties").withInputStream { versionProps.load(it) }

android {
    namespace 'com.arkael.app'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.arkael.app"
        minSdk 24
        targetSdk 34
        versionCode versionProps.getProperty("versionCode").toInteger()
        versionName versionProps.getProperty("versionName")
    }

    signingConfigs {
        release {
            storeFile file("release.jks")
            def ksPass = System.getenv("KEYSTORE_PASSWORD")
            def keyPass = System.getenv("KEY_PASSWORD")
            def alias = System.getenv("ALIAS")

            if (ksPass == null || keyPass == null || alias == null) {
                throw new GradleException("Release signing secret missing. Required: KEYSTORE_PASSWORD, KEY_PASSWORD, ALIAS")
            }

            storePassword ksPass
            keyAlias alias
            keyPassword keyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.github.bumptech.glide:gifdecoder:4.16.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
